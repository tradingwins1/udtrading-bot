name: AI Trading Bot CI/CD

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 13 * * 1-5"  # Runs every weekday at 9:30 AM EST

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot (Dry Run)
        run: |
          python data_feed.py MNQ --asset_type futures
